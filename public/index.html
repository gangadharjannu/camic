<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Camic - Test your camera and microphone online</title>
    <meta
      name="description"
      content="Camic allows you to test your camera and microphone in a web page without sharing your details"
    />
    <meta
      name="keywords"
      content="webcam test, check camera, check mic, check camera and mic online, test camera and mic online, test camera, test mic, test camera online, test mic online"
    />
    <meta name="author" content="Gangadhar Jannu" />
    <meta name="theme-color" content="#2F3BA2" />
    <link rel="canonical" href="https://camic.netlify.app/" />
    <link rel="manifest" href="manifest.json" />
    <link rel="icon" href="favicon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="assets/apple-icon-180.png" />
    <link rel="apple-touch-icon" sizes="167x167" href="assets/apple-icon-167.png" />
    <link rel="apple-touch-icon" sizes="152x152" href="assets/apple-icon-152.png" />
    <link rel="apple-touch-icon" sizes="120x120" href="assets/apple-icon-120.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="Camic" />
    <link rel="stylesheet" href="styles.css" />
    <script src="app.js" defer></script>
  </head>

  <body>
    <main class="camic-container">
      <video id="video" class="mirrored" autoplay muted playsinline></video>

      <div id="volume-meter" class="meter hidden" aria-hidden="true">
        <div class="meter-fill"></div>
      </div>

      <div class="controls hidden">
        <label class="control">
          <span class="visually-hidden">Camera</span>
          <select id="camera-select" title="Camera"></select>
        </label>
        <label class="control">
          <span class="visually-hidden">Microphone</span>
          <select id="mic-select" title="Microphone"></select>
        </label>
        <button id="mirror-toggle" type="button" aria-pressed="true" title="Mirror video">
          Mirror
        </button>
        <button id="install-button" type="button" hidden>Install</button>
        <span id="video-info" class="info"></span>
      </div>

      <p class="overlay-text hidden">
        All the processing is done inside your browser. No data is shared with anyone.
      </p>
    </main>

    <!-- help block -->
    <div class="help-text">
      <p class="message error hidden" id="error-message" role="alert"></p>
      <p class="message notice hidden" id="notice-message" role="status"></p>
    </div>

    <noscript>Enable JavaScript to test your camera and mic online</noscript>
  </body>
</html>
